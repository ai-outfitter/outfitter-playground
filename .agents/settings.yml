# Outfitter settings for the playground.
#
# Deliberate divergence from the org catalog rule (org repos normally declare
# ai-outfitter/.agents as their only source): this repository is built to be
# forked and run outside the organization, so it pins the public community
# catalog directly. The pin keeps every fork reproducible — bump the ref on
# purpose, never remove it.
default_agent: hardware-engineer
default_harness: pi
workflows:
  - pcb-design
sources:
  - github: ai-outfitter/community-profiles
    # Temporary review pin. Replace with the release containing PRs #88, #90,
    # #96, and #102 before this branch is considered for main.
    ref: feat/pcb-supplier-quote
